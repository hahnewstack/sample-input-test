# Runs playwright/tests/special/migration_redirections.spec.ts against a live site.
#
# Modelled on react-testing's qa-tests.yml / run-any-test.yml, but self-contained:
# this repo has none of react-testing's composite actions (set-site-env,
# install-dependencies, run-playwright-test, process-playwright-report), so the
# equivalent steps are inlined here, and it runs on ubuntu-latest instead of the
# self-hosted arc-runner-set-* pool.
#
# Manual only (plus workflow_call): the test hits a production site once per CSV
# row, so it should not fire on every push.
#
# Every run needs a new CSV, kept on the user's machine rather than in the repo
# (input/migration_redirections.csv is only a format sample and is never used
# here). Start runs with run_migration.py: it gzips + base64-encodes the local
# CSV into the csv_data input and dispatches this workflow. GitHub caps all
# dispatch inputs at 65,535 characters in total; the script checks the encoded
# size first.
name: Migration Redirections Test
# request_id lets run_migration.py find the run it just dispatched.
run-name: Migration redirections ${{ inputs.catalog_id }} ${{ inputs.test_env }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL used to resolve relative "To" paths'
        required: true
        type: string
        default: 'https://www.mgalleryboutique.com'
      catalog_id:
        description: 'Site code (used in the report filename)'
        required: true
        type: string
        default: 'mgl'
      test_env:
        description: 'Environment label (used in the report filename)'
        required: true
        type: choice
        options:
          - stage
          - production
        default: 'stage'
      csv_data:
        description: 'Filled in by run_migration.py (the local CSV, gzip+base64). Start runs with that script.'
        required: true
        type: string
      max_rows:
        description: 'Max CSV rows to check (0 = all)'
        required: false
        type: string
        default: '0'
      request_delay_ms:
        description: 'Delay between requests (ms)'
        required: false
        type: string
        default: '1000'
      max_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: string
        default: '300'
      request_id:
        description: 'Set by run_migration.py to identify the run'
        required: false
        type: string
        default: ''
  workflow_call: # Allow it to be called from another repo/workflow
    inputs:
      base_url:
        type: string
        required: true
      catalog_id:
        type: string
        required: true
      test_env:
        type: string
        required: false
        default: 'stage'
      csv_data:
        type: string
        required: true
      max_rows:
        type: string
        required: false
        default: '0'
      request_delay_ms:
        type: string
        required: false
        default: '1000'
      max_minutes:
        type: string
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  migration-redirections:
    name: Migration redirections (${{ inputs.catalog_id }} - ${{ inputs.test_env }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.max_minutes) }}
    env:
      BASE_URL: ${{ inputs.base_url }}
      CATALOG_ID: ${{ inputs.catalog_id }}
      TEST_ENV: ${{ inputs.test_env }}
      MAX_ROWS: ${{ inputs.max_rows }}
      REQUEST_DELAY_MS: ${{ inputs.request_delay_ms }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Prepare input CSV
        env:
          CSV_DATA: ${{ inputs.csv_data }}
        run: |
          if [ -z "$CSV_DATA" ]; then
            echo "::error::No CSV was sent. Start this workflow with run_migration.py, which uploads your local CSV."
            exit 1
          fi
          MIGRATION_CSV_PATH="$RUNNER_TEMP/migration_redirections.csv"
          if ! printf '%s' "$CSV_DATA" | base64 -d | gunzip > "$MIGRATION_CSV_PATH"; then
            echo "::error::csv_data is not valid gzip+base64. Start this workflow with run_migration.py."
            exit 1
          fi
          echo "MIGRATION_CSV_PATH=$MIGRATION_CSV_PATH" >> "$GITHUB_ENV"
          echo "::notice::Checking $(($(wc -l < "$MIGRATION_CSV_PATH") - 1)) rows from the uploaded CSV against $BASE_URL"

      # xvfb-run gives the browser a display: the spec notes it is only reliable
      # with headless off, same reason react-testing installs xvfb on its runners.
      - name: Run migration redirections test
        id: run_test
        run: |
          # Leave 5 minutes of the job budget for the summary and report upload.
          export TEST_TIMEOUT_MS=$(( (MAX_MINUTES - 5) * 60000 ))
          xvfb-run --auto-servernum npm run test:migration

      - name: Summarise failures
        if: always()
        run: |
          {
            echo "## Migration redirections: $CATALOG_ID ($TEST_ENV)"
            echo ""
            echo "- Base URL: $BASE_URL"
            echo "- CSV: uploaded by run_migration.py"
            echo "- Test result: ${{ steps.run_test.outcome }}"
            REPORT=$(ls test-reports/migration-redirections-*.csv 2>/dev/null | head -1)
            if [ -n "$REPORT" ]; then
              echo "- Failure report: \`$(basename "$REPORT")\` ($(($(wc -l < "$REPORT") - 1)) rows), in the \`test-reports\` artifact"
            else
              echo "- No failure CSV was written"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-redirections-${{ inputs.catalog_id }}-${{ inputs.test_env }}-${{ github.run_id }}
          path: |
            test-reports/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

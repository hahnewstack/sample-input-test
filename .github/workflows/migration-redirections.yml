# Runs playwright/tests/special/migration_redirections.spec.ts against a live site.
#
# Modelled on react-testing's qa-tests.yml / run-any-test.yml, but self-contained:
# this repo has none of react-testing's composite actions (set-site-env,
# install-dependencies, run-playwright-test, process-playwright-report), so the
# equivalent steps are inlined here, and it runs on ubuntu-latest instead of the
# self-hosted arc-runner-set-* pool.
#
# Manual only (plus workflow_call): the test hits a production site once per CSV
# row, so it should not fire on every push.
#
# Every run needs a new CSV, which is never committed to the repo
# (input/migration_redirections.csv is only a format sample and is never used
# here). The CSV is read from a link given when the run starts: a Google Sheet,
# or any URL that returns the CSV file. See .github/scripts/fetch_csv.py.
#
# Private Google Sheets: add a GOOGLE_SERVICE_ACCOUNT_JSON repo secret holding
# a service account key, and share the sheet with that service account's email.
# Without the secret, the sheet must be shared as "Anyone with the link: Viewer".
name: Migration Redirections Test
run-name: Migration redirections ${{ inputs.catalog_id }} ${{ inputs.test_env }}

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'Link to the CSV: a Google Sheet (copy the link from the browser) or a URL that downloads the CSV'
        required: true
        type: string
      catalog_id:
        description: 'Site code (used in the report filename), e.g. lemeu, sof, mgl'
        required: true
        type: string
        default: 'mgl'
      test_env:
        description: 'Environment label (used in the report filename)'
        required: true
        type: choice
        options:
          - stage
          - production
        default: 'stage'
      base_url:
        description: 'Base URL for relative "To" paths (leave empty to use the host of the first "From" link)'
        required: false
        type: string
        default: ''
      max_rows:
        description: 'Max CSV rows to check (0 = all)'
        required: false
        type: string
        default: '0'
      request_delay_ms:
        description: 'Delay between requests (ms)'
        required: false
        type: string
        default: '1000'
      max_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: string
        default: '300'
  workflow_call: # Allow it to be called from another repo/workflow
    inputs:
      csv_url:
        type: string
        required: true
      catalog_id:
        type: string
        required: true
      test_env:
        type: string
        required: false
        default: 'stage'
      base_url:
        type: string
        required: false
        default: ''
      max_rows:
        type: string
        required: false
        default: '0'
      request_delay_ms:
        type: string
        required: false
        default: '1000'
      max_minutes:
        type: string
        required: false
        default: '300'
    secrets:
      GOOGLE_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

jobs:
  migration-redirections:
    name: Migration redirections (${{ inputs.catalog_id }} - ${{ inputs.test_env }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.max_minutes) }}
    # BASE_URL and MIGRATION_CSV_PATH are not set here: the "Download input CSV"
    # step writes them to GITHUB_ENV, and a job-level value would override that.
    env:
      CATALOG_ID: ${{ inputs.catalog_id }}
      TEST_ENV: ${{ inputs.test_env }}
      MAX_ROWS: ${{ inputs.max_rows }}
      REQUEST_DELAY_MS: ${{ inputs.request_delay_ms }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # First, so a bad link or a sheet that isn't shared fails in seconds, before
      # any installs.
      - name: Download input CSV
        id: csv
        env:
          CSV_URL: ${{ inputs.csv_url }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            pip install --quiet google-auth requests
          fi
          export OUT_PATH="$RUNNER_TEMP/migration_redirections.csv"
          python3 .github/scripts/fetch_csv.py

          # The step's own outputs aren't readable until it ends, so read them back from the file.
          BASE_URL="${INPUT_BASE_URL:-$(grep '^base_url=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::Could not work out a base URL from the CSV's first From link; fill in base_url."
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "MIGRATION_CSV_PATH=$OUT_PATH" >> "$GITHUB_ENV"
          ROWS=$(grep '^rows=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          echo "::notice::Checking $ROWS rows against $BASE_URL"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # xvfb-run gives the browser a display: the spec notes it is only reliable
      # with headless off, same reason react-testing installs xvfb on its runners.
      - name: Run migration redirections test
        id: run_test
        run: |
          # Leave 5 minutes of the job budget for the summary and report upload.
          export TEST_TIMEOUT_MS=$(( (MAX_MINUTES - 5) * 60000 ))
          xvfb-run --auto-servernum npm run test:migration

      - name: Summarise failures
        if: always()
        env:
          CSV_URL: ${{ inputs.csv_url }}
        run: |
          {
            echo "## Migration redirections: $CATALOG_ID ($TEST_ENV)"
            echo ""
            echo "- CSV: $CSV_URL (${{ steps.csv.outputs.rows || '?' }} rows)"
            echo "- Base URL: ${BASE_URL:-not set}"
            echo "- Test result: ${{ steps.run_test.outcome || 'not run' }}"
            REPORT=$(ls test-reports/migration-redirections-*.csv 2>/dev/null | head -1)
            if [ -n "$REPORT" ]; then
              echo "- Failure report: \`$(basename "$REPORT")\` ($(($(wc -l < "$REPORT") - 1)) rows), in the \`test-reports\` artifact"
            else
              echo "- No failure CSV was written"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-redirections-${{ inputs.catalog_id }}-${{ inputs.test_env }}-${{ github.run_id }}
          path: |
            test-reports/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
